# =============================================================================
# Monitor de carbón importado — origen Colombia, destino Puerto Conchán (Perú)
#
# Los valores marcados con "AJUSTAR" son supuestos iniciales: reemplázalos por
# los de tus contratos / cotizaciones reales. Todo está en USD salvo que se
# indique lo contrario.
# =============================================================================

# Solo se sigue el precio FOB y el CFR Conchán (FOB + flete marítimo);
# no se calcula el costo puesto en planta.
destino:
  puerto: "Muelle Conchán, Lima (PE)"

carbon:
  nombre: "Carbón térmico — origen Colombia"
  origen: "Colombia (Puerto Nuevo / Santa Marta / Pto. Drummond)"
  hs: "270112"                    # Hulla bituminosa
  poder_calorifico_ref_kcal_kg: 6000   # base de los índices (NAR) — API2 y Newcastle ~6000 NAR
  poder_calorifico_spec_kcal_kg: 7000  # requerimiento de las plantas UNACEM
  poder_calorifico_comercio_pe_kcal_kg: 6000  # escenario B: el comercio Colombia→Perú se toma en base 6,000 y se ajusta x 7000/6000
  presupuesto_cfr_usd_t: null    # referencia CFR Conchán (USD/t); vacío = sin alerta de referencia
  # Atenuantes para comparar el CFR con ofertas (supuestos de mercado, USD/t) — AJUSTAR
  atenuantes:
    granulometria_usd_t: 4.5      # chancado y tamizado para granulometría fina (rango 3 a 6)
    calidad_usd_t: 1.5            # baja ceniza y azufre
    plazo_pago_dias: 60           # crédito del vendedor desde la fecha del B/L
    tasa_anual_pct: 8.0           # costo financiero del crédito
  # Flete Colombia -> Conchán vía Canal de Panamá (Supramax/Panamax)
  flete:
    base_usd_t: 24.0              # flete de referencia con Brent = brent_base — AJUSTAR
    brent_base_usd_bbl: 80.0
    elasticidad_bunker: 0.45      # % de cambio del flete por % de cambio del Brent
  # Ratios FOB Colombia / índice, usados sólo si no hay datos para calibrarlos.
  # Se recalibran con UN Comtrade: exportaciones de Colombia a Perú (mediana de los últimos 12 datos).
  ratio_colombia_api2_default: 0.85       # API2 es CIF Rotterdam: incluye flete al ARA
  ratio_colombia_newcastle_default: 0.88
  benchmark_preferido: "api2"     # api2 | newcastle  (el carbón colombiano es del Atlántico)

escoria:
  nombre: "Escoria granulada de alto horno (GBFS), origen Japón"
  origen: "Japón"
  hs: "261800"                    # Escorias granuladas (arena de escorias)
  presupuesto_cfr_usd_t: null     # referencia CFR Conchán (USD/t); vacío = sin alerta de referencia
  fob_default_usd_t: 8.0          # FOB Japón si no hay ningún dato de UN Comtrade
  # Para comparar el CFR con ofertas: solo el costo del crédito (supuesto de mercado) — AJUSTAR
  atenuantes:
    plazo_pago_dias: 60
    tasa_anual_pct: 8.0
  # Flete Japón -> Conchán (Handysize/Supramax, ruta de retorno desde Asia)
  flete:
    base_usd_t: 38.0              # flete de referencia con Brent = brent_base — AJUSTAR
    brent_base_usd_bbl: 80.0
    elasticidad_bunker: 0.40
    meses_calibracion: 36         # meses de flete implícito (CIF Perú − FOB Japón) para calibrar

# CSV descargados de Investing.com ("Datos históricos" -> Descargar) y guardados en
# data/carbon/manual/investing/. El nombre del archivo decide la serie (palabra clave).
investing:
  carpeta: "data/carbon/manual/investing"
  series:
    api2: carbon_api2_cif_ara
    rotterdam: carbon_api2_cif_ara
    newcastle: carbon_newcastle_futuro
    richards: carbon_api4_fob_rb
    api4: carbon_api4_fob_rb

# Alertas
alertas:
  variacion_mensual_pct: 8.0      # alerta si un precio clave se mueve más que esto (MoM)
  zscore: 2.0                     # alerta si el último dato se aleja > N desviaciones (24m)
  margen_presupuesto_pct: 0.0     # alerta si CFR > referencia * (1 + margen)

# Fuentes públicas (todas gratuitas). Claves opcionales via variables de entorno.
fuentes:
  inicio: "2018-01"               # primer mes a descargar
  fred: true                      # Newcastle (IMF), Brent, USD/COP
  banco_mundial: true             # Pink Sheet: carbón Australia/Sudáfrica/Colombia
  bcrp: true                      # Tipo de cambio PEN/USD (BCRP)
  comtrade: true                  # Valores unitarios CIF Perú / FOB Colombia
  comtrade_meses: 24              # cuántos meses hacia atrás consultar en Comtrade
  investing: true                 # CSV de Investing en data/carbon/manual/investing
  manual: true                    # data/carbon/manual/*.csv (tus cotizaciones y fletes)

# Notificación por Telegram (opcional): TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID
notificaciones:
  telegram: true
