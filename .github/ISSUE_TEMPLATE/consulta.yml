name: Consulta al agente
description: Pregunta sobre los precios del diésel, el carbón o la escoria. La respuesta llega aquí y por correo.
title: "Consulta: "
labels: ["consulta"]
body:
  - type: textarea
    id: pregunta
    attributes:
      label: Tu pregunta
      description: Escríbela como se la harías a una persona del equipo. Si la pregunta ya está en el título, puedes dejar esto breve.
      placeholder: "Ej.: ¿Cuál fue el promedio ponderado del B5 S-50 en Conchán en junio de 2025?"
    validations:
      required: true
