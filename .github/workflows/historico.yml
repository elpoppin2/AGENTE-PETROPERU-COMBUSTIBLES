name: Cargar histórico Petroperú

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha inicial (AAAA-MM-DD)"
        default: "2023-01-01"
        required: true

permissions:
  contents: write

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Leer listas desde ${{ inputs.desde }}
        run: |
          set -o pipefail
          python agente_petroperu.py --historico "${{ inputs.desde }}" 2>&1 | tee data/historico.log
      - name: Guardar en el repositorio
        if: always()
        run: |
          git config user.name "agente-petroperu"
          git config user.email "agente-petroperu@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Histórico Petroperú desde ${{ inputs.desde }}"
          git pull --rebase origin main && git push
