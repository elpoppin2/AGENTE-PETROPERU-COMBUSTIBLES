name: Monitor carbón importado

on:
  schedule:
    - cron: "17 12 * * 1"      # lunes 07:17 hora de Lima
  workflow_dispatch:
    inputs:
      sin_agente:
        description: "Omitir el análisis con Claude"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "data/carbon/manual/**"   # al cargar cotizaciones o CSV de Investing se regenera el reporte
      - "carbon/config.yaml"

permissions:
  contents: write

concurrency:
  group: monitor-carbon
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m pytest -q tests/carbon

      - name: Descargar datos y generar reporte
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/reportes/carbon/ultimo_reporte.md
        run: python -m carbon all ${{ inputs.sin_agente && '--sin-agente' || '' }}

      - name: Publicar resumen
        run: cat reportes/carbon/ultimo_reporte.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar histórico y reporte
        run: |
          git config user.name "monitor-carbon"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/carbon/historico reportes/carbon
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Monitor carbón $(TZ=America/Lima date +%F)"
            git pull --rebase origin main && git push
          fi
