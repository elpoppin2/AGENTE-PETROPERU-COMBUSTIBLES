name: Precios carbones internacionales

on:
  schedule:
    - cron: "17 12 * * 1"      # lunes 07:17 hora de Lima
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/carbon/manual/**"   # al cargar cotizaciones o CSV de Investing se regenera el reporte
      - "carbon/config.yaml"

permissions:
  contents: write
  issues: write   # para publicar el aviso de alertas

concurrency:
  group: monitor-carbon
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # siempre lo último de main: así dos ejecuciones seguidas no repiten el mismo aviso

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m pytest -q tests/carbon

      - name: Descargar datos y generar reporte
        id: reporte
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/reportes/carbon/ultimo_reporte.md
        run: python -m carbon all

      - name: Publicar resumen
        run: cat reportes/carbon/ultimo_reporte.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar histórico y reporte
        run: |
          git config user.name "monitor-carbon"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/carbon/historico reportes/carbon
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Monitor carbón $(TZ=America/Lima date +%F)"
            git pull --rebase origin main && git push
          fi

      - name: Avisar alertas nuevas
        # Solo si aparecieron alertas que no se habían avisado (GitHub también lo envía a la app).
        id: aviso
        if: steps.reporte.outputs.aviso != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AVISO: ${{ steps.reporte.outputs.aviso }}
          TITULO: ${{ steps.reporte.outputs.titulo }}
        run: |
          gh label create "alerta carbón" --color fbca04 --description "Alertas del carbón bituminoso" 2>/dev/null || true
          tail -n +3 "$AVISO" > cuerpo_carbon.md
          URL=$(gh issue create --title "$TITULO" --body-file cuerpo_carbon.md --label "alerta carbón")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Enviar alertas por correo
        # Mismos destinatarios y cuenta que los avisos del diésel (secrets AVISO_*).
        if: steps.aviso.outcome == 'success'
        env:
          AVISO_CORREO_USUARIO: ${{ secrets.AVISO_CORREO_USUARIO }}
          AVISO_CORREO_CLAVE: ${{ secrets.AVISO_CORREO_CLAVE }}
          AVISO_CORREOS: ${{ secrets.AVISO_CORREOS }}
        run: python -m carbon enviar --enlace "${{ steps.aviso.outputs.url }}"
