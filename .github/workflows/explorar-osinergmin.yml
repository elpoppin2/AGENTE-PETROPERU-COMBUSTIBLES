name: Explorar Osinergmin (temporal)
on:
  push:
    branches: [exploracion-osinergmin]
    paths: [explorar/**]
permissions:
  contents: write
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pdfplumber beautifulsoup4 && python explorar/faltantes.py
      - run: |
          git config user.name agente-petroperu
          git config user.email agente-petroperu@users.noreply.github.com
          git add explorar/salida && git commit -m "Resultado exploración Osinergmin" && git push
