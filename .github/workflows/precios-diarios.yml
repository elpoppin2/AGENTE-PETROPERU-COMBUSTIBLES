name: Precios diarios Petroperú

on:
  schedule:
    # Hora de Lima = UTC-5 (Perú no cambia de horario en el año).
    - cron: "0 13 * * *"    # 08:00 hora de Lima
    - cron: "30 17 * * *"   # 12:30 hora de Lima
  workflow_dispatch:         # permite ejecutarlo a mano desde la pestaña Actions
    inputs:
      reenviar_aviso:
        description: "Enviar otra vez el aviso de la última lista (para probar las alertas)"
        type: boolean
        default: false
      forzar_reporte_diario:
        description: "Enviar el reporte diario aunque ya haya salido hoy (para probarlo)"
        type: boolean
        default: false

# Si dos ejecuciones coinciden, la segunda espera a la primera.
concurrency:
  group: precios-petroperu
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # para publicar el aviso de cambio de precio

jobs:
  consultar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ejecutar agente
        id: agente
        run: |
          set -o pipefail
          python agente_petroperu.py 2>&1 | tee data/ultima_ejecucion.log
      - name: Preparar de nuevo el aviso de la última lista
        id: prueba
        if: inputs.reenviar_aviso
        run: python agente_petroperu.py --reporte ultima
      - name: Reporte diario por correo
        # Sale una vez al día, en la primera ejecución desde las 07:00 de Lima, haya o no cambios.
        id: diario
        env:
          AVISO_CORREO_USUARIO: ${{ secrets.AVISO_CORREO_USUARIO }}
          AVISO_CORREO_CLAVE: ${{ secrets.AVISO_CORREO_CLAVE }}
          AVISO_CORREOS: ${{ secrets.AVISO_CORREOS }}
          AVISO_WHATSAPP: ${{ secrets.AVISO_WHATSAPP }}
        run: python agente_petroperu.py --reporte-diario ${{ inputs.forzar_reporte_diario && '--forzar' || '' }}
      - name: Guardar historial en el repositorio
        if: always()
        run: |
          git config user.name "agente-petroperu"
          git config user.email "agente-petroperu@users.noreply.github.com"
          mkdir -p reportes
          git add data/ reportes/
          git diff --cached --quiet || git commit -m "Precios Petroperú $(TZ=America/Lima date +%F)"
          git pull --rebase origin main && git push
      - name: Avisar del cambio de precio
        # GitHub envía el aviso por correo y a la app de GitHub de quien vigila el repositorio.
        id: aviso
        if: ${{ !cancelled() && (steps.agente.outputs.reporte != '' || steps.prueba.outputs.reporte != '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPORTE: ${{ steps.agente.outputs.reporte || steps.prueba.outputs.reporte }}
          TITULO: ${{ steps.agente.outputs.titulo || steps.prueba.outputs.titulo }}
        run: |
          gh label create "cambio de precio" --color d73a4a --description "Nueva lista de precios de Petroperú" 2>/dev/null || true
          tail -n +3 "$REPORTE" > cuerpo.md   # sin el título, que va como título del aviso
          URL=$(gh issue create --title "$TITULO" --body-file cuerpo.md --label "cambio de precio")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Enviar por correo y WhatsApp
        # Destinatarios y claves se guardan como secrets del repositorio (ver README).
        # Si el reporte diario ya salió en esta ejecución, ya incluye la lista nueva.
        if: steps.aviso.outcome == 'success' && steps.diario.outputs.enviado != 'true'
        env:
          REPORTE: ${{ steps.agente.outputs.reporte || steps.prueba.outputs.reporte }}
          AVISO_CORREO_USUARIO: ${{ secrets.AVISO_CORREO_USUARIO }}
          AVISO_CORREO_CLAVE: ${{ secrets.AVISO_CORREO_CLAVE }}
          AVISO_CORREOS: ${{ secrets.AVISO_CORREOS }}
          AVISO_WHATSAPP: ${{ secrets.AVISO_WHATSAPP }}
        run: python agente_petroperu.py --enviar "$(basename "$REPORTE" .md)" --enlace "${{ steps.aviso.outputs.url }}"
