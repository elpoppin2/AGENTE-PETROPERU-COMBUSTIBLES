name: Configurar agente de consultas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "agente/instrucciones.md"
      - "agente/configurar.py"

permissions:
  contents: write

jobs:
  configurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic

      - name: Crear o actualizar el agente
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "Falta el secreto ANTHROPIC_API_KEY: no se configura el agente."
            exit 0
          fi
          python agente/configurar.py

      - name: Guardar los identificadores
        run: |
          git config user.name "agente-consultas"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agente/ids.json 2>/dev/null || exit 0
          git diff --cached --quiet || { git commit -m "Agente de consultas: identificadores"; git pull --rebase origin main && git push; }
